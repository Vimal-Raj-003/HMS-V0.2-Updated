global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: ${DEPLOY_ENV}

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: vims-api
    metrics_path: /metrics
    static_configs: [{ targets: ['api:3001'] }]
  - job_name: vims-worker
    static_configs: [{ targets: ['worker:3002'] }]
  - job_name: vims-realtime
    static_configs: [{ targets: ['realtime:4001'] }]
  - job_name: vims-integration-hub
    static_configs: [{ targets: ['integration-hub:4002'] }]
  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8889'] }]
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]

alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]
