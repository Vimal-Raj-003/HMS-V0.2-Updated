apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vims-hms.fullname" . }}-api
  labels: {{- include "vims-hms.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.rollout.maxSurge }}
      maxUnavailable: {{ .Values.rollout.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vims-hms.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vims-hms.name" . }}
        app.kubernetes.io/component: api
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "vims-hms.image" (dict "Values" .Values "component" "hms-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{ containerPort: 3001, name: http }]
          envFrom:
            - secretRef: { name: {{ .Values.secrets.existingSecret }} }
          env:
            - name: NODE_ENV
              value: production
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            {{- end }}
          # Liveness deliberately does not reach the database — see values.yaml.
          livenessProbe:
            httpGet: { path: {{ .Values.api.livenessPath }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: {{ .Values.api.readinessPath }}, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
