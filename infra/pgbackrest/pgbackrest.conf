# pgBackRest — on-prem. docs/10 §8.
#
# Two repositories with SEPARATE credentials, deliberately:
#   repo1  local NVMe/NAS — fast restores, the one used for a routine mistake.
#   repo2  off-site object storage with object-lock/immutability — the one that
#          survives ransomware on the hospital domain. It uses its own credential
#          set so that compromising the hospital's identity provider does not
#          also grant delete on the backups. That separation is the whole point;
#          a shared credential makes repo2 decorative.
#
# Both repositories are encrypted (AES-256-CBC). The passphrase lives in the
# secret store, never in this file and never in the repository.
[global]
repo1-path=/backup/pgbackrest
repo1-retention-full=4
repo1-retention-full-type=count
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=${PGBACKREST_REPO1_CIPHER_PASS}

repo2-type=s3
repo2-s3-bucket=vims-hms-backup-${TENANT_SLUG}
repo2-s3-endpoint=${BACKUP_S3_ENDPOINT}
repo2-s3-region=${BACKUP_S3_REGION}
repo2-s3-key=${BACKUP_S3_KEY}
repo2-s3-key-secret=${BACKUP_S3_SECRET}
repo2-retention-full=8
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=${PGBACKREST_REPO2_CIPHER_PASS}

process-max=4
compress-type=zst
compress-level=3
start-fast=y
archive-async=y
archive-push-queue-max=32GiB
# A backup that has never been read back is a hypothesis. This makes pgBackRest
# verify checksums as it writes; restore-drill.sh proves the rest.
repo1-bundle=y
log-level-console=info
log-level-file=detail

[vimshms]
pg1-path=/data/pg
pg1-port=5432
pg1-user=postgres
